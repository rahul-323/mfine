name: mfine_ui_clone
description: A responsive MFine-style healthcare UI prototype recreated from user-provided references.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  go_router: ^16.2.1
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  pdf: ^3.13.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/files/
